# Deploy mapanytime-api to production.
#
# Flow: docker build -> push to ECR -> publish the runtime env as an SSM
# SecureString -> SSM RunCommand pulls the image, migrates, and restarts the
# API and worker containers.
#
# Identical in shape to deploy-staging.yml — the on-box work is the same
# infra/deploy-remote.sh, parameterised. The only differences are the values in
# the `env:` block below and that this workflow is dispatch-only.
#
# See infra/README.md for the AWS-side setup and the cutover checklist.

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: true
        default: main

concurrency:
  group: mapanytime-api-deploy-production
  # Deploys are not safe to interrupt. A cancelled run can leave the old
  # container removed and the new one never started, which on production is an
  # outage rather than an inconvenience.
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NODE_ENV: production
  CONTAINER_NAME: mapanytime-api
  # Matches the container the old workflow created as "${CONTAINER_NAME}-worker",
  # so this deploy replaces it rather than leaving an orphan running alongside.
  WORKER_NAME: mapanytime-api-worker
  DOCKER_NETWORK: mapanytime
  ENV_FILE_PATH: /opt/mapanytime-api/production.env
  SSM_ENV_PARAMETER: /mapanytime/production/env

  # Production publishes the API on the same port it listens on, unlike staging
  # which offsets them.
  APP_PORT: 4002
  HOST_PORT: 4002
  WORKER_PORT: 8080
  WORKER_HOST_PORT: 8080

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mapanytime' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          set -euo pipefail
          # `git rev-parse HEAD`, not `github.sha`. This workflow checks out
          # `inputs.ref`, while `github.sha` is the commit the *dispatch* came
          # from — so tagging with it names a commit that is not in the image.
          # Deploying a branch would then produce an image whose tag lies about
          # its contents, which is a miserable thing to discover mid-incident.
          SHA=$(git rev-parse HEAD)
          echo "image_tag=$SHA" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$SHA" >> "$GITHUB_ENV"
          echo "Building $SHA"

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          ECR="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$ECR:${IMAGE_TAG}" -t "$ECR:latest" .
          docker push "$ECR:${IMAGE_TAG}"
          docker push "$ECR:latest"

  deploy:
    name: Deploy via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mapanytime' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          REDIS_TLS: ${{ secrets.REDIS_TLS || 'false' }}
          REDIS_TTL_SECONDS: ${{ secrets.REDIS_TTL_SECONDS || '3600' }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY || '15m' }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          # Was '1d' here while the code default was '30d'. Since the session row
          # now derives its expiry from this value (F99), leaving it at a day
          # would cap every session at a day — a regression from the effective
          # seven the old 7d access token gave. Aligned with the code default.
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY || '30d' }}
          MAILER_TRANSPORT_HOST: ${{ secrets.MAILER_TRANSPORT_HOST || secrets.SMTP_HOST || 'smtp.ethereal.email' }}
          MAILER_TRANSPORT_PORT: ${{ secrets.MAILER_TRANSPORT_PORT || secrets.SMTP_PORT || '587' }}
          MAILER_TRANSPORT_SECURE: ${{ secrets.MAILER_TRANSPORT_SECURE || 'false' }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL || secrets.SMTP_USER || '' }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD || secrets.SMTP_PASS || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.MAILER_TRANSPORT_HOST || 'smtp.ethereal.email' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || secrets.MAILER_TRANSPORT_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.MAILER_EMAIL || '' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.MAILER_PASSWORD || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY || '' }}
          PAYMONGO_WEBHOOK_SECRET_KEY: ${{ secrets.PAYMONGO_WEBHOOK_SECRET_KEY || '' }}
          # No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY here, deliberately.
          # The box authenticates as its instance role, which holds S3 on the
          # bucket below plus ECR pull. A static key in this file overrides that
          # role in the SDK's credential chain — and a stale one breaks the
          # deploy itself, because deploy-remote.sh sources this file before
          # `aws ecr get-login-password`. That is how 2026-09-10 was spent.
          APP_AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME || secrets.S3_BUCKET }}
          S3_CDN_URL: ${{ secrets.S3_CDN_URL || '' }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL || 'amqp://guest:guest@localhost:5672/' }}
          RABBITMQ_EXCHANGE: ${{ secrets.RABBITMQ_EXCHANGE || 'app_events_exchange' }}
          RABBITMQ_QUEUE_PREFIX: ${{ secrets.RABBITMQ_QUEUE_PREFIX || 'app' }}
          INGESTION_QUEUE_NAME: ${{ secrets.INGESTION_QUEUE_NAME || 'ingestion_jobs' }}
          WORKER_HEALTH_PORT: ${{ secrets.WORKER_HEALTH_PORT || '8080' }}
          METRICS_INTERVAL_MS: ${{ secrets.METRICS_INTERVAL_MS || '60000' }}
          # No fallback, unlike staging. This is the origin the CORS smoke test
          # asserts against, and an empty value silently skips that check — which
          # is how F94 shipped green for a week.
          MAPANYTIME_WEB_APP_URL: ${{ secrets.MAPANYTIME_WEB_APP_URL }}
        run: |
          set -euo pipefail

          # printf per line rather than a heredoc. An unquoted `<< EOF` expands
          # its body, so a secret containing a backtick, `$(` or a backslash is
          # interpreted by the shell instead of stored — DATABASE_URL,
          # MAILER_PASSWORD and the PayMongo keys are all plausible carriers.
          # Quoting the terminator is not an option, because these values do
          # need substituting; writing each line explicitly is.
          umask 077
          {
            printf 'DATABASE_URL=%s\n'                "$DATABASE_URL"
            printf 'NODE_ENV=%s\n'                    '${{ env.NODE_ENV }}'
            printf 'PORT=%s\n'                        '${{ env.APP_PORT }}'
            printf 'CORS_ORIGIN=%s\n'                 "$CORS_ORIGIN"
            printf 'REDIS_HOST=%s\n'                  "$REDIS_HOST"
            printf 'REDIS_PORT=%s\n'                  "$REDIS_PORT"
            printf 'REDIS_PASSWORD=%s\n'              "$REDIS_PASSWORD"
            printf 'REDIS_TLS=%s\n'                   "$REDIS_TLS"
            printf 'REDIS_TTL_SECONDS=%s\n'           "$REDIS_TTL_SECONDS"
            printf 'ACCESS_TOKEN_SECRET=%s\n'         "$ACCESS_TOKEN_SECRET"
            printf 'ACCESS_TOKEN_EXPIRY=%s\n'         "$ACCESS_TOKEN_EXPIRY"
            printf 'REFRESH_TOKEN_SECRET=%s\n'        "$REFRESH_TOKEN_SECRET"
            printf 'REFRESH_TOKEN_EXPIRY=%s\n'        "$REFRESH_TOKEN_EXPIRY"
            printf 'MAILER_TRANSPORT_HOST=%s\n'       "$MAILER_TRANSPORT_HOST"
            printf 'MAILER_TRANSPORT_PORT=%s\n'       "$MAILER_TRANSPORT_PORT"
            printf 'MAILER_TRANSPORT_SECURE=%s\n'     "$MAILER_TRANSPORT_SECURE"
            printf 'MAILER_EMAIL=%s\n'                "$MAILER_EMAIL"
            printf 'MAILER_PASSWORD=%s\n'             "$MAILER_PASSWORD"
            printf 'SMTP_HOST=%s\n'                   "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n'                   "$SMTP_PORT"
            printf 'SMTP_USER=%s\n'                   "$SMTP_USER"
            printf 'SMTP_PASS=%s\n'                   "$SMTP_PASS"
            printf 'OPENAI_API_KEY=%s\n'              "$OPENAI_API_KEY"
            printf 'CHAT_WONDER_API_URL=%s\n'         "$CHAT_WONDER_API_URL"
            printf 'GOOGLE_CLIENT_ID=%s\n'            "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n'        "$GOOGLE_CLIENT_SECRET"
            printf 'PAYMONGO_SECRET_KEY=%s\n'         "$PAYMONGO_SECRET_KEY"
            printf 'PAYMONGO_WEBHOOK_SECRET_KEY=%s\n' "$PAYMONGO_WEBHOOK_SECRET_KEY"
            printf 'AWS_REGION=%s\n'                  "$APP_AWS_REGION"
            printf 'AWS_S3_BUCKET_NAME=%s\n'          "$AWS_S3_BUCKET_NAME"
            printf 'S3_CDN_URL=%s\n'                  "$S3_CDN_URL"
            printf 'RABBITMQ_URL=%s\n'                "$RABBITMQ_URL"
            printf 'RABBITMQ_EXCHANGE=%s\n'           "$RABBITMQ_EXCHANGE"
            printf 'RABBITMQ_QUEUE_PREFIX=%s\n'       "$RABBITMQ_QUEUE_PREFIX"
            printf 'INGESTION_QUEUE_NAME=%s\n'        "$INGESTION_QUEUE_NAME"
            printf 'WORKER_HEALTH_PORT=%s\n'          "$WORKER_HEALTH_PORT"
            printf 'METRICS_INTERVAL_MS=%s\n'         "$METRICS_INTERVAL_MS"
            printf 'MAPANYTIME_WEB_APP_URL=%s\n'      "$MAPANYTIME_WEB_APP_URL"
          } > runtime.env

      - name: Publish env to Parameter Store
        run: |
          set -euo pipefail

          # A static AWS credential in the runtime env overrides the instance
          # role in the SDK's credential chain, and a stale one takes the deploy
          # down at `docker login` rather than at the app. Fail here, where the
          # message names the cause, instead of on the box where it reads as
          # "UnrecognizedClientException".
          if grep -qE '^AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN)=' runtime.env; then
            echo "runtime.env contains static AWS credentials." >&2
            echo "The instance role provides S3 and ECR access — remove them." >&2
            exit 1
          fi

          aws ssm put-parameter \
            --name "${{ env.SSM_ENV_PARAMETER }}" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION" \
            --value "file://runtime.env" >/dev/null
          echo "Published $(wc -l < runtime.env) env lines to ${{ env.SSM_ENV_PARAMETER }}"
          rm -f runtime.env

      - name: Send deploy command via SSM
        id: send-command
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
          TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
        run: |
          set -euo pipefail

          MISSING=""
          require_var() {
            if [[ -z "$2" ]]; then MISSING="${MISSING} $1"; fi
          }
          require_var EC2_TARGET_TAG_KEY "$TAG_KEY"
          require_var EC2_TARGET_TAG_VALUE "$TAG_VALUE"
          if [[ -n "$MISSING" ]]; then
            echo "Missing required GitHub configuration:${MISSING}" >&2
            exit 1
          fi

          # Only non-secret config is prepended. The secrets are in Parameter
          # Store; deploy-remote.sh fetches them on the box. See its header for
          # why they must never move into this command.
          {
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "ECR_REPOSITORY=$ECR_REPOSITORY"
            echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}"
            echo "AWS_REGION=$AWS_REGION"
            echo "SSM_ENV_PARAMETER=${{ env.SSM_ENV_PARAMETER }}"
            echo "ENV_FILE_PATH=${{ env.ENV_FILE_PATH }}"
            echo "CONTAINER_NAME=${{ env.CONTAINER_NAME }}"
            echo "WORKER_NAME=${{ env.WORKER_NAME }}"
            echo "DOCKER_NETWORK=${{ env.DOCKER_NETWORK }}"
            echo "APP_PORT=${{ env.APP_PORT }}"
            echo "HOST_PORT=${{ env.HOST_PORT }}"
            echo "WORKER_PORT=${{ env.WORKER_PORT }}"
            echo "WORKER_HOST_PORT=${{ env.WORKER_HOST_PORT }}"
            echo "export ECR_REGISTRY ECR_REPOSITORY IMAGE_TAG AWS_REGION"
            echo "export SSM_ENV_PARAMETER ENV_FILE_PATH CONTAINER_NAME WORKER_NAME"
            echo "export DOCKER_NETWORK APP_PORT HOST_PORT WORKER_PORT WORKER_HOST_PORT"
            cat infra/deploy-remote.sh
          } > deploy.sh

          PARAMS=$(jq -n --rawfile script deploy.sh \
            '{commands: [$script], executionTimeout: ["1800"]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ env.CONTAINER_NAME }} ${{ needs.build-and-push.outputs.image_tag }}" \
            --targets "Key=tag:${TAG_KEY},Values=${TAG_VALUE}" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --region "$AWS_REGION" \
            --output text --query "Command.CommandId")

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID targeting tag:${TAG_KEY}=${TAG_VALUE}"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
          TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
        run: |
          set -euo pipefail

          sleep 8

          # 90 x 10s = 15 minutes. A cold pull plus `prisma migrate deploy` plus
          # the health-check loop comfortably exceeds a shorter budget, and
          # running out of attempts while the command is still InProgress would
          # report a false failure on a deploy that is actually fine.
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" \
              --region "$AWS_REGION" \
              --query "Commands[0].Status" --output text 2>/dev/null || echo "Pending")
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" ]]; then
              break
            fi
            echo "Deploy status: $STATUS (attempt $i/90)"
            sleep 10
          done

          echo "Final command status: $STATUS"

          INSTANCE_IDS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
            --region "$AWS_REGION" \
            --query "CommandInvocations[].InstanceId" --output text)

          # send-command happily returns a CommandId when the tag matches
          # nothing, so an empty invocation list is the only signal that the
          # deploy went nowhere.
          if [[ -z "$INSTANCE_IDS" ]]; then
            echo "No instances matched tag:${TAG_KEY}=${TAG_VALUE} for this SSM command."
            echo "Check the tag, and that the instance is a managed node:"
            echo "  aws ssm describe-instance-information"
            exit 1
          fi

          FAILED=0
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "::group::Instance $INSTANCE_ID"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
              --output json > invocation.json
            cat invocation.json
            INV_STATUS=$(jq -r ".Status" invocation.json)
            if [[ "$INV_STATUS" != "Success" ]]; then
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [[ "$STATUS" == "InProgress" || "$STATUS" == "Pending" ]]; then
            echo "Timed out after 15 minutes with the command still running."
            echo "This is a timeout, not necessarily a failed deploy — check SSM Run Command."
            exit 1
          fi

          if [[ "$FAILED" -ne 0 ]]; then
            echo "One or more instances failed to deploy."
            exit 1
          fi

          echo "Deploy succeeded on: $INSTANCE_IDS"
