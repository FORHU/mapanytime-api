name: Deploy Staging

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: true
        default: staging

concurrency:
  group: mapanytime-api-deploy-staging
  cancel-in-progress: true

env:
  ECR_REPOSITORY: mapanytime-api-staging # <-- must match the ECR repo you created
  AWS_REGION: ap-southeast-1 # <-- set to your staging region
  NODE_ENV: staging
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  EC2_IAM_ROLE_NAME: forhu-staging-mapanytime-api-role # <-- EC2 instance profile role name
  CONTAINER_NAME: mapanytime-api-staging
  WORKER_NAME: mapanytime-api-worker-staging
  DOCKER_NETWORK: mapanytime-staging
  ENV_FILE_NAME: mapanytime-api-staging.env

  APP_PORT: 4002
  HOST_PORT: 4003
  WORKER_PORT: 8080
  WORKER_HOST_PORT: 8081

jobs:
  deploy:
    name: Build, Push & Deploy (staging)
    # Only deploy on a successful CI run triggered by a push (not by a PR),
    # or when manually dispatched.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Grant EC2 role ECR pull access
        run: |
          aws iam put-role-policy \
            --role-name "${{ env.EC2_IAM_ROLE_NAME }}" \
            --policy-name mapanytime-api-ecr-pull \
            --policy-document file://infra/ec2-ecr-pull-policy.json

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build -t "$ECR:${{ env.IMAGE_TAG }}" -t "$ECR:latest" .
          docker push "$ECR:${{ env.IMAGE_TAG }}"
          docker push "$ECR:latest"

      - name: Write env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          REDIS_TLS: ${{ secrets.REDIS_TLS || 'false' }}
          REDIS_TTL_SECONDS: ${{ secrets.REDIS_TTL_SECONDS || '3600' }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY || '7d' }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY || '1d' }}
          MAILER_TRANSPORT_HOST: ${{ secrets.MAILER_TRANSPORT_HOST || secrets.SMTP_HOST || 'smtp.ethereal.email' }}
          MAILER_TRANSPORT_PORT: ${{ secrets.MAILER_TRANSPORT_PORT || secrets.SMTP_PORT || '587' }}
          MAILER_TRANSPORT_SECURE: ${{ secrets.MAILER_TRANSPORT_SECURE || 'false' }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL || secrets.SMTP_USER || '' }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD || secrets.SMTP_PASS || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.MAILER_TRANSPORT_HOST || 'smtp.ethereal.email' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || secrets.MAILER_TRANSPORT_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.MAILER_EMAIL || '' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.MAILER_PASSWORD || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY || '' }}
          PAYMONGO_WEBHOOK_SECRET_KEY: ${{ secrets.PAYMONGO_WEBHOOK_SECRET_KEY || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID || secrets.APP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.APP_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || secrets.APP_AWS_REGION || env.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME || secrets.S3_BUCKET }}
          S3_CDN_URL: ${{ secrets.S3_CDN_URL || '' }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL || 'amqp://guest:guest@localhost:5672/' }}
          RABBITMQ_EXCHANGE: ${{ secrets.RABBITMQ_EXCHANGE || 'app_events_exchange' }}
          RABBITMQ_QUEUE_PREFIX: ${{ secrets.RABBITMQ_QUEUE_PREFIX || 'app' }}
          INGESTION_QUEUE_NAME: ${{ secrets.INGESTION_QUEUE_NAME || 'ingestion_jobs' }}
          WORKER_HEALTH_PORT: ${{ secrets.WORKER_HEALTH_PORT || '8080' }}
          METRICS_INTERVAL_MS: ${{ secrets.METRICS_INTERVAL_MS || '60000' }}
        run: |
          cat > ${{ github.workspace }}/${{ env.ENV_FILE_NAME }} << EOF
          DATABASE_URL=${DATABASE_URL}
          NODE_ENV=${{ env.NODE_ENV }}
          PORT=${{ env.APP_PORT }}
          CORS_ORIGIN=${CORS_ORIGIN}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_TLS=${REDIS_TLS}
          REDIS_TTL_SECONDS=${REDIS_TTL_SECONDS}
          ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
          ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
          REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
          REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
          MAILER_TRANSPORT_HOST=${MAILER_TRANSPORT_HOST}
          MAILER_TRANSPORT_PORT=${MAILER_TRANSPORT_PORT}
          MAILER_TRANSPORT_SECURE=${MAILER_TRANSPORT_SECURE}
          MAILER_EMAIL=${MAILER_EMAIL}
          MAILER_PASSWORD=${MAILER_PASSWORD}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${SMTP_PASS}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          CHAT_WONDER_API_URL=${CHAT_WONDER_API_URL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          PAYMONGO_SECRET_KEY=${PAYMONGO_SECRET_KEY}
          PAYMONGO_WEBHOOK_SECRET_KEY=${PAYMONGO_WEBHOOK_SECRET_KEY}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_REGION=${AWS_REGION}
          AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
          S3_CDN_URL=${S3_CDN_URL}
          RABBITMQ_URL=${RABBITMQ_URL}
          RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
          RABBITMQ_QUEUE_PREFIX=${RABBITMQ_QUEUE_PREFIX}
          INGESTION_QUEUE_NAME=${INGESTION_QUEUE_NAME}
          WORKER_HEALTH_PORT=${WORKER_HEALTH_PORT}
          METRICS_INTERVAL_MS=${METRICS_INTERVAL_MS}
          EOF

      - name: Copy env file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ${{ env.ENV_FILE_NAME }}
          target: /home/ec2-user/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            chmod 600 /home/ec2-user/${{ env.ENV_FILE_NAME }}
            set -a
            source /home/ec2-user/${{ env.ENV_FILE_NAME }}
            set +a
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            docker network inspect ${{ env.DOCKER_NETWORK }} >/dev/null 2>&1 \
              || docker network create ${{ env.DOCKER_NETWORK }}

            # Run migrations before swapping the container.
            # --entrypoint overrides the image CMD so only the migration runs (not the app).
            docker run --rm \
              --entrypoint npx \
              --network ${{ env.DOCKER_NETWORK }} \
              --env-file /home/ec2-user/${{ env.ENV_FILE_NAME }} \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
              prisma migrate deploy

            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm   ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped \
              --network ${{ env.DOCKER_NETWORK }} \
              --env-file /home/ec2-user/${{ env.ENV_FILE_NAME }} \
              -p ${{ env.HOST_PORT }}:${{ env.APP_PORT }} \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            docker stop ${{ env.WORKER_NAME }} 2>/dev/null || true
            docker rm   ${{ env.WORKER_NAME }} 2>/dev/null || true
            docker run -d --name ${{ env.WORKER_NAME }} --restart unless-stopped \
              --network ${{ env.DOCKER_NETWORK }} \
              --env-file /home/ec2-user/${{ env.ENV_FILE_NAME }} \
              -p 127.0.0.1:${{ env.WORKER_HOST_PORT }}:${{ env.WORKER_PORT }} \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
              npm run worker

            # Health check loop for API container
            echo "Verifying API container health..."
            HEALTH_CHECK_PASSED=false
            for i in {1..10}; do
              if curl -sf http://127.0.0.1:${{ env.HOST_PORT }}/api/health/live > /dev/null 2>&1; then
                echo "Health check passed!"
                HEALTH_CHECK_PASSED=true
                break
              fi
              echo "Waiting for API to become ready... (attempt $i/10)"
              sleep 3
            done

            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "Health check failed after 30 seconds. Displaying container logs:"
              docker logs ${{ env.CONTAINER_NAME }} --tail 50
              exit 1
            fi

            docker image prune -f
