# Deploy mapanytime-api to staging.
#
# Flow: docker build -> push to ECR -> publish the runtime env as an SSM
# SecureString -> SSM RunCommand pulls the image, migrates, and restarts the
# API and worker containers.
#
# Follows the same shape as gc3-client-web's production deploy: OIDC role
# assumption, tag-based SSM targeting, per-environment config in `vars`. Two
# things are deliberately different, both because this service is not a static
# front end:
#
#   1. The env file goes through Parameter Store, never inside the SSM command.
#      gc3 inlines its env safely because every value there is NEXT_PUBLIC_* and
#      already public. This one carries DATABASE_URL, the token signing secrets
#      and the payment keys, and SSM keeps command text for 30 days.
#   2. The on-box script lives in infra/deploy-remote.sh rather than a heredoc,
#      so it can be diffed and shellchecked, and so staging and production
#      cannot drift by being edited separately. It health-checks the container
#      and asserts a CORS preflight before declaring success (see F94).
#
# ---------------------------------------------------------------------------
# One-time AWS setup:
#
# 1. IAM role for GitHub, trusted via infra/aws-oidc-trust-policy.json, with
#    infra/cicd-deploy-policy.json attached. Its ARN goes in the
#    AWS_DEPLOY_ROLE_ARN secret. This replaces the static key pair.
# 2. Tag the staging instance so SendCommand can target it, and set
#    EC2_TARGET_TAG_KEY / EC2_TARGET_TAG_VALUE to match.
# 3. Attach to the instance role (forhu-staging-mapanytime-api-role):
#    AmazonSSMManagedInstanceCore, ec2-ecr-pull-policy.json,
#    ec2-cloudwatch-logs-policy.json, ec2-app-runtime-policy.json.
#
# See infra/README.md for the full checklist.
# ---------------------------------------------------------------------------

name: Deploy Staging

on:
  # Fires when CI finishes on `staging` — which is this repo's default branch and
  # where every PR actually merges.
  #
  # This used to watch `main`. Nothing has landed on `main` in 25 commits, so the
  # trigger never fired and staging could only be deployed by hand; the branch
  # looks abandoned rather than release-bearing. CI already runs on pushes to
  # `staging`, so this needs no change on the CI side.
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: true
        default: main

concurrency:
  group: mapanytime-api-deploy-staging
  # Deploys are not safe to interrupt: a cancelled run can leave the old
  # container removed and the new one never started.
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NODE_ENV: staging
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  CONTAINER_NAME: mapanytime-api-staging
  WORKER_NAME: mapanytime-api-worker-staging
  DOCKER_NETWORK: mapanytime-staging
  ENV_FILE_PATH: /opt/mapanytime-api/staging.env
  SSM_ENV_PARAMETER: /mapanytime/staging/env

  APP_PORT: 4002
  HOST_PORT: 4003
  WORKER_PORT: 8080
  WORKER_HOST_PORT: 8081

jobs:
  build-and-push:
    name: Build and push image
    # Only deploy on a successful CI run triggered by a push (not by a PR),
    # or when manually dispatched.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mapanytime-api-staging' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Published as a step output rather than read from `env` in the job's
      # `outputs:` block — the deploy job must tag and pull the exact image this
      # job pushed, and a step output is the unambiguous way to hand it over.
      - name: Set image metadata
        id: meta
        run: echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          ECR="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$ECR:${IMAGE_TAG}" -t "$ECR:staging-latest" .
          docker push "$ECR:${IMAGE_TAG}"
          docker push "$ECR:staging-latest"

  deploy:
    name: Deploy via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mapanytime-api-staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          REDIS_TLS: ${{ secrets.REDIS_TLS || 'false' }}
          REDIS_TTL_SECONDS: ${{ secrets.REDIS_TTL_SECONDS || '3600' }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY || '15m' }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY || '30d' }}
          MAILER_TRANSPORT_HOST: ${{ secrets.MAILER_TRANSPORT_HOST || secrets.SMTP_HOST || 'smtp.ethereal.email' }}
          MAILER_TRANSPORT_PORT: ${{ secrets.MAILER_TRANSPORT_PORT || secrets.SMTP_PORT || '587' }}
          MAILER_TRANSPORT_SECURE: ${{ secrets.MAILER_TRANSPORT_SECURE || 'false' }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL || secrets.SMTP_USER || '' }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD || secrets.SMTP_PASS || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.MAILER_TRANSPORT_HOST || 'smtp.ethereal.email' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || secrets.MAILER_TRANSPORT_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.MAILER_EMAIL || '' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.MAILER_PASSWORD || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY || '' }}
          PAYMONGO_WEBHOOK_SECRET_KEY: ${{ secrets.PAYMONGO_WEBHOOK_SECRET_KEY || '' }}
          APP_AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME || secrets.S3_BUCKET }}
          S3_CDN_URL: ${{ secrets.S3_CDN_URL || '' }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL || 'amqp://guest:guest@localhost:5672/' }}
          RABBITMQ_EXCHANGE: ${{ secrets.RABBITMQ_EXCHANGE || 'app_events_exchange' }}
          RABBITMQ_QUEUE_PREFIX: ${{ secrets.RABBITMQ_QUEUE_PREFIX || 'app' }}
          INGESTION_QUEUE_NAME: ${{ secrets.INGESTION_QUEUE_NAME || 'ingestion_jobs' }}
          WORKER_HEALTH_PORT: ${{ secrets.WORKER_HEALTH_PORT || '8080' }}
          METRICS_INTERVAL_MS: ${{ secrets.METRICS_INTERVAL_MS || '60000' }}
          MAPANYTIME_WEB_APP_URL: ${{ secrets.MAPANYTIME_WEB_APP_URL || '' }}
        run: |
          cat > runtime.env << EOF
          DATABASE_URL=${DATABASE_URL}
          NODE_ENV=${{ env.NODE_ENV }}
          PORT=${{ env.APP_PORT }}
          CORS_ORIGIN=${CORS_ORIGIN}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_TLS=${REDIS_TLS}
          REDIS_TTL_SECONDS=${REDIS_TTL_SECONDS}
          ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
          ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
          REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
          REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
          MAILER_TRANSPORT_HOST=${MAILER_TRANSPORT_HOST}
          MAILER_TRANSPORT_PORT=${MAILER_TRANSPORT_PORT}
          MAILER_TRANSPORT_SECURE=${MAILER_TRANSPORT_SECURE}
          MAILER_EMAIL=${MAILER_EMAIL}
          MAILER_PASSWORD=${MAILER_PASSWORD}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${SMTP_PASS}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          CHAT_WONDER_API_URL=${CHAT_WONDER_API_URL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          PAYMONGO_SECRET_KEY=${PAYMONGO_SECRET_KEY}
          PAYMONGO_WEBHOOK_SECRET_KEY=${PAYMONGO_WEBHOOK_SECRET_KEY}
          AWS_REGION=${APP_AWS_REGION}
          AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
          S3_CDN_URL=${S3_CDN_URL}
          RABBITMQ_URL=${RABBITMQ_URL}
          RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
          RABBITMQ_QUEUE_PREFIX=${RABBITMQ_QUEUE_PREFIX}
          INGESTION_QUEUE_NAME=${INGESTION_QUEUE_NAME}
          WORKER_HEALTH_PORT=${WORKER_HEALTH_PORT}
          METRICS_INTERVAL_MS=${METRICS_INTERVAL_MS}
          MAPANYTIME_WEB_APP_URL=${MAPANYTIME_WEB_APP_URL}
          EOF

      - name: Publish env to Parameter Store
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "${{ env.SSM_ENV_PARAMETER }}" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION" \
            --value "file://runtime.env" >/dev/null
          echo "Published $(wc -l < runtime.env) env lines to ${{ env.SSM_ENV_PARAMETER }}"
          rm -f runtime.env

      - name: Send deploy command via SSM
        id: send-command
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
          TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
        run: |
          set -euo pipefail

          MISSING=""
          require_var() {
            if [[ -z "$2" ]]; then MISSING="${MISSING} $1"; fi
          }
          require_var EC2_TARGET_TAG_KEY "$TAG_KEY"
          require_var EC2_TARGET_TAG_VALUE "$TAG_VALUE"
          # AWS_DEPLOY_ROLE_ARN is not checked here — the credentials step above
          # already fails without it, and interpolating a secret into a shell
          # command line is worth avoiding even when it would be masked.
          if [[ -n "$MISSING" ]]; then
            echo "Missing required GitHub configuration:${MISSING}" >&2
            exit 1
          fi

          # Only non-secret config is prepended. The secrets are in Parameter
          # Store; deploy-remote.sh fetches them on the box. See its header for
          # why they must never move into this command.
          {
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "ECR_REPOSITORY=$ECR_REPOSITORY"
            echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}"
            echo "AWS_REGION=$AWS_REGION"
            echo "SSM_ENV_PARAMETER=${{ env.SSM_ENV_PARAMETER }}"
            echo "ENV_FILE_PATH=${{ env.ENV_FILE_PATH }}"
            echo "CONTAINER_NAME=${{ env.CONTAINER_NAME }}"
            echo "WORKER_NAME=${{ env.WORKER_NAME }}"
            echo "DOCKER_NETWORK=${{ env.DOCKER_NETWORK }}"
            echo "APP_PORT=${{ env.APP_PORT }}"
            echo "HOST_PORT=${{ env.HOST_PORT }}"
            echo "WORKER_PORT=${{ env.WORKER_PORT }}"
            echo "WORKER_HOST_PORT=${{ env.WORKER_HOST_PORT }}"
            echo "export ECR_REGISTRY ECR_REPOSITORY IMAGE_TAG AWS_REGION"
            echo "export SSM_ENV_PARAMETER ENV_FILE_PATH CONTAINER_NAME WORKER_NAME"
            echo "export DOCKER_NETWORK APP_PORT HOST_PORT WORKER_PORT WORKER_HOST_PORT"
            cat infra/deploy-remote.sh
          } > deploy.sh

          PARAMS=$(jq -n --rawfile script deploy.sh \
            '{commands: [$script], executionTimeout: ["1800"]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ env.CONTAINER_NAME }} ${{ needs.build-and-push.outputs.image_tag }}" \
            --targets "Key=tag:${TAG_KEY},Values=${TAG_VALUE}" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --region "$AWS_REGION" \
            --output text --query "Command.CommandId")

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID targeting tag:${TAG_KEY}=${TAG_VALUE}"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
          TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
        run: |
          set -euo pipefail

          sleep 8

          # 90 x 10s = 15 minutes. The first pull onto a cold box, plus
          # `prisma migrate deploy`, plus the health-check loop, comfortably
          # exceeds a five-minute budget — and running out of poll attempts
          # while the command is still InProgress reports a false failure on a
          # deploy that is actually fine.
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" \
              --region "$AWS_REGION" \
              --query "Commands[0].Status" --output text 2>/dev/null || echo "Pending")
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" ]]; then
              break
            fi
            echo "Deploy status: $STATUS (attempt $i/90)"
            sleep 10
          done

          echo "Final command status: $STATUS"

          INSTANCE_IDS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
            --region "$AWS_REGION" \
            --query "CommandInvocations[].InstanceId" --output text)

          # send-command happily returns a CommandId when the tag matches
          # nothing, so an empty invocation list is the only signal that the
          # deploy went nowhere.
          if [[ -z "$INSTANCE_IDS" ]]; then
            echo "No instances matched tag:${TAG_KEY}=${TAG_VALUE} for this SSM command."
            echo "Check the tag, and that the instance is a managed node:"
            echo "  aws ssm describe-instance-information"
            exit 1
          fi

          FAILED=0
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "::group::Instance $INSTANCE_ID"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
              --output json > invocation.json
            cat invocation.json
            INV_STATUS=$(jq -r ".Status" invocation.json)
            if [[ "$INV_STATUS" != "Success" ]]; then
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [[ "$STATUS" == "InProgress" || "$STATUS" == "Pending" ]]; then
            echo "Timed out after 15 minutes with the command still running."
            echo "This is a timeout, not necessarily a failed deploy — check SSM Run Command."
            exit 1
          fi

          if [[ "$FAILED" -ne 0 ]]; then
            echo "One or more instances failed to deploy."
            exit 1
          fi

          echo "Deploy succeeded on: $INSTANCE_IDS"
