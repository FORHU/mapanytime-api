services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - '${REDIS_INSIGHT_PORT:-5540}:5540'
    volumes:
      - redis-insight_data:/data
    depends_on:
      - redis

  # The event bus (#127): SNS + SQS, emulated. Private to each machine, so a
  # message published here is only ever consumed by this machine's worker.
  #
  # Pinned to a pre-2026.03 tag on purpose. From 2026.03 LocalStack ships one
  # image that exits at startup without LOCALSTACK_AUTH_TOKEN, `latest`
  # included. This tag runs without an account but gets no more updates.
  localstack:
    image: localstack/localstack:3
    restart: always
    environment:
      - SERVICES=sqs,sns
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}
      - QUEUE_MAX_RECEIVES=${QUEUE_MAX_RECEIVES:-4}
    ports:
      # Host 4576, not LocalStack's usual 4566, so it can run beside another
      # project's LocalStack. Inside the network it is still localstack:4566.
      - '${LOCALSTACK_PORT:-4576}:4566'
    volumes:
      # Creates the topic, queues, DLQs and subscriptions on every start; the
      # free image keeps them only in memory.
      - ./docker/localstack/init-events.sh:/etc/localstack/init/ready.d/init-events.sh:ro
    healthcheck:
      # Healthy only once every ready.d script has SUCCEEDED. /_localstack/health
      # turns healthy before the queues exist, and "completed": true alone also
      # appears when a script failed.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:4566/_localstack/init/ready | grep -q '"completed": true'
          && ! curl -sf http://localhost:4566/_localstack/init/ready | grep -qE '"state": "(UNKNOWN|RUNNING|ERROR)"'
      interval: 3s
      timeout: 5s
      retries: 30

  # S3 for local development. Developers are never issued AWS credentials —
  # this is the standing rule, and it is why nothing here talks to AWS.
  # Deployed environments use the EC2 instance role instead, which is why the
  # app must not pass credentials unless S3_ENDPOINT is set.
  #
  # The root user/password below are not secrets: they are identical on every
  # machine, grant nothing outside this container, and exist only because the
  # S3 protocol requires a signature.
  minio:
    # MinIO's images were withdrawn from Docker Hub — `minio/minio` there now
    # 404s, which Docker reports as "pull access denied … may require docker
    # login", so it reads like an auth problem rather than a missing repo.
    # quay.io is the publisher now, and it ships no `latest` tag for the server
    # at all, only dated releases — hence the pin.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # browser console
    volumes:
      - minio_data:/data

  # One-shot: creates the bucket so the app never has to, and makes objects
  # readable without a signature — matching how the real bucket is served.
  #
  # Retries in a loop rather than relying on a healthcheck, because the minio
  # server image does not reliably ship a tool to health-check itself with.
  minio-init:
    # quay.io does publish `mc:latest`, but pinned anyway: a one-shot bootstrap
    # that changes under you is not worth the convenience.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio'; sleep 1;
      done;
      mc mb --ignore-existing local/${AWS_S3_BUCKET_NAME:-forhu-marketplace-dev};
      mc anonymous set download local/${AWS_S3_BUCKET_NAME:-forhu-marketplace-dev};
      echo 'minio ready';
      "

  app:
    build: .
    restart: always
    ports:
      - '${PORT:-4002}:${PORT:-4002}'
    env_file:
      - .env
    # Override the localhost-based URLs from .env so the container reaches
    # the other services by their compose service names instead of itself.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-node_postg_db}?schema=public
      REDIS_HOST: redis
      # The event bus, by compose service name. Same account id (LocalStack's
      # default) as the localhost URLs in .env.example.
      AWS_SNS_ENDPOINT: http://localstack:4566
      AWS_SQS_ENDPOINT: http://localstack:4566
      EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-ap-southeast-1}:000000000000:mapanytime-events
      EMAIL_SEND_QUEUE_URL: http://localstack:4566/000000000000/email-send
      ANALYTICS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/analytics-events

      # Two endpoints, deliberately.
      #
      # S3_ENDPOINT is what this container talks to — a compose service name,
      # resolvable only inside the network.
      #
      # S3_PUBLIC_ENDPOINT is what presigned URLs must be signed against,
      # because those URLs are handed to a browser on the host, which cannot
      # resolve "minio". A presigned URL's host is part of what it signs, so
      # signing with the internal name produces a link the browser cannot use
      # and the signature cannot be repaired by rewriting it afterwards.
      #
      # Both are unset in deployed environments, which is what makes the app
      # fall back to real S3 and the instance role.
      #
      # S3_PUBLIC_ENDPOINT defers to .env when set, because "the host" is not
      # always localhost: the Flutter app runs on a physical phone, which cannot
      # resolve localhost and so cannot load any image signed against it. Set
      # S3_PUBLIC_ENDPOINT to this machine's LAN IP to serve both. Default keeps
      # the previous behaviour for anyone who leaves it unset.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      S3_FORCE_PATH_STYLE: 'true'
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-forhu-marketplace-dev}
      # Set here rather than in .env so no developer keeps anything that looks
      # like an AWS key on their machine.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      # Not just started: the topic and queues must exist first.
      localstack:
        condition: service_healthy

  worker:
    build: .
    # Runs the compiled worker, not `npm run worker`. That script is nodemon +
    # ts-node over ./src/worker.ts, and the production image copies only dist/,
    # so the container crashed on "Cannot find module './worker.ts'" and every
    # scheduled job silently never ran. Mirrors the image's own `start` script.
    command: node ./dist/src/worker.js
    restart: always
    ports:
      - '${WORKER_HEALTH_PORT:-8080}:8080'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-node_postg_db}?schema=public
      REDIS_HOST: redis
      # The event bus, by compose service name. Same account id (LocalStack's
      # default) as the localhost URLs in .env.example.
      AWS_SNS_ENDPOINT: http://localstack:4566
      AWS_SQS_ENDPOINT: http://localstack:4566
      EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-ap-southeast-1}:000000000000:mapanytime-events
      EMAIL_SEND_QUEUE_URL: http://localstack:4566/000000000000/email-send
      ANALYTICS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/analytics-events
      S3_ENDPOINT: http://minio:9000
      # Defers to .env like the app service above; see the note there.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      S3_FORCE_PATH_STYLE: 'true'
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-forhu-marketplace-dev}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      # Not just started: the topic and queues must exist first.
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  redis-insight_data:
  minio_data:
